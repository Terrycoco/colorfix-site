<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon2.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Watch ColorFix paint color transformations and palette ideas." />
    <title>ColorFix Player</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #000;
      }

      .cf-player-boot {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        background: #000;
      }

      .cf-player-boot span {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.9);
        animation: cf-player-boot-pulse 1s ease-in-out infinite;
      }

      .cf-player-boot span:nth-child(2) {
        animation-delay: 0.14s;
      }

      .cf-player-boot span:nth-child(3) {
        animation-delay: 0.28s;
      }

      @keyframes cf-player-boot-pulse {
        0%,
        80%,
        100% {
          opacity: 0.35;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-5px);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="cf-player-boot" role="status" aria-label="Loading playlist">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
    <script type="module" src="/src/player-main.jsx"></script>
  </body>
</html>
